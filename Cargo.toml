[package]
name = "mavsdk-rust-ffi"
version = "0.1.0"
edition = "2024"

[dependencies]
autocxx = "0.30.0"
cmake = "0.1.54"
cxx = "1.0.78"
glob = "0.3.2"

[build-dependencies]
autocxx-build = { git = "https://github.com/zeroy0410/autocxx.git", branch = "fix_issue_1488" } #PR: https://github.com/google/autocxx/pull/1490, without this patch, many plugins do not build
cmake = "0.1.54"
miette = { version = "5", features = ["fancy"] }
glob = { version = "0.3.2" }
